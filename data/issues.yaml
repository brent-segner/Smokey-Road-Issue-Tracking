# Longer-term consequences that will outlast the punch list.
impacts:
  intro: >
    Separate from the individual items above, several decisions made during
    construction will continue to affect the property after the open items are
    closed. We are recording them here so they are part of the same record.
  entries:
    - title: "Floor plan not reversed; well and septic moved away from the agreed location"
      related: [SR-38, SR-39]
      text: |
        The contract states that the garage should be on the high side of the homesite and that this would be verified at the homesite inspection (p. 5). The plan was not reversed to meet that requirement, and it set off a series of further changes:
        - Schumacher moved the septic and well away from the originally agreed location between the house and the pole barn pad.
        - Bushong (well drilling) quoted $3,391 to run a water line out to the pole barn pad.
        - The pole barn will now need its own compact septic system to pump to the mound, instead of sharing the house's system as planned. That cost will be quoted after this project is complete.
        - The same decision led to the extra driveway gravel in SR-39 and the unusable wet bar rough-in and steel beam in SR-38.
    - title: "Temporary heat costs while electrical and HVAC work remains open"
      related: [SR-06]
      text: |
        Under the contract, homeowners pay for temporary heat during construction (p. 30, ¶15). Because the electrical and HVAC work is not yet complete, temporary heat is still needed well past the original completion estimates. As of November 20, 2026:
        - Heater rental: $723.
        - Propane: about $2,500 and growing.
        - Schumacher adds an 18% surcharge to items it orders on our behalf, which includes both the heater rental and the propane.
        - Both renew the first week of December if the electrical and HVAC work is not finished.
        - We have pointed out that the heaters run in the garage with the overhead and service doors open day and night (with the mud room door closed), and in the basement with the egress window open, so much of the heat is lost outside.
        We ask that doors and windows be kept closed while the heaters are running, and for a date when the permanent HVAC system will be operating.

    - title: "Electrical trench re-excavated through the site and driveway after county approval"
      related: [SR-05, SR-39]
      photos: [trench-2026-11-27-a.jpg, trench-2026-11-27-b.jpg, trench-2026-11-27-c.jpg, trench-2026-11-27-d.jpg]
      text: |
        We were told the final grade would be done the week of November 9 so the driveway could be completed the week of November 16.
        - The driveway stone was delivered on November 17 and the driveway was installed. The final grade has still not been scheduled.
        - On November 27, the electrician excavated the trench to the house, crossing the driveway.
        - The site was left with spoil piles along the driveway and around the house, and mud and soil mixed into the driveway stone. The driveway surface is now rutted and holding water, and will need to be regraded and re-stoned.
        - The Union County Engineer inspected and approved the electrical trench on November 5. It is not clear whether the November 27 excavation affects that approval or whether another inspection is now required.
        We ask that Schumacher restore the driveway and the disturbed areas at no cost to us, confirm with the Union County Engineer whether a re-inspection is needed, and provide updated dates for the final grade and the driveway.

