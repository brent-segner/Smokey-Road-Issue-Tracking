  - id: SR-05
    title: "Grade and downspouts: water ponds against the foundation"
    area: "Exterior: Rear & Sides"
    type: Incomplete
    contract: Schumacher
    trade: Grading / site drainage
    status: Open
    description: |
      After rain on November 26, water was ponding against the foundation wall at every downspout location. The ground around the house is flat or slopes toward the foundation, so water spreads along the wall instead of draining away.

      The Residential Code of Ohio (R401.3) requires lots to be graded so surface water drains away from the foundation, with the grade falling at least 6 inches within the first 10 feet.

      We understand the downspout extensions are outside the contract and will install them ourselves after closing. Extensions alone will not solve this if the grade still slopes toward the house.
    correction: >
      Complete the final grade so the ground slopes away from the foundation on all
      sides, meeting R401.3. Until the final grade is done, place splash blocks at
      each downspout to keep water off the foundation. Confirm the date for the final
      grade and how much of the Additional Grading Allowance has been used. This
      item stays open until the finished grade is confirmed to drain water away
      from the foundation.
    contract_ref: "p. 7: Included Soffits, Fascia and Downspouts; p. 23: Additional Grading Allowance ($2,000)"
    photos: [SR-05-b.jpg, SR-05-c.jpg, SR-05-d.jpg, SR-05-a.jpg]
    history:
      - { date: "2026-11-19", note: "Added to report" }
      - { date: "2026-11-25", note: "Steven Price: downspout extensions are homeowner responsibility" }
      - { date: "2026-11-26", note: "Water ponding at every downspout after rain; item expanded to cover grading; photos added" }


  - id: SR-06
    title: "Flooring: installed without required temperature control and acclimation"
    area: "Whole House"
    type: Workmanship
    contract: Schumacher
    trade: Flooring
    status: Open
    description: >
      The contract calls for Level 2 laminate (Restoration Collection, SC8630 Regent
      Natural) in place of the included LVT in the main living areas and dining room,
      and LVT in all baths. The manufacturers' installation guidelines for these
      floors require the room and materials to be held within a set temperature
      range before installation (24 to 72 hours), throughout installation, and for at
      least 48 hours afterward. The flooring appears to have been installed without
      an adequate acclimation period, and doors and windows were repeatedly left open
      while the homeowners were paying for salamander-heater rental and propane.
    correction: >
      Provide the manufacturer's written acclimation and installation requirements
      for each product, the installation dates, and the temperature and humidity
      conditions before, during, and after installation, with an explanation of how
      compliance was ensured. Inspect for resulting problems such as gapping,
      peaking, or separation, and identify corrective action if needed.
    contract_ref: "p. 12: Level 2 laminate in place of LVT, 1,053 sq ft (SC8630 Regent Natural); p. 13: Level 2 laminate in place of carpet, dining room; Included LVT, \"Prestige – Natural, all baths\"; p. 30, ¶15: homeowners pay for temporary heat during construction"
    photos: []
    notes: "No photos; condition not visible in a photo."
    history:
      - { date: "2026-11-19", note: "Added to report" }

