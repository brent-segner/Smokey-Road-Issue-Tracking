report:
  title: "Smokey Road Build: Outstanding Items & Correction Report"
  homeowners: "Deanna and Brent Segner"
  builder: "Schumacher Homes"
  last_updated: "2026-11-27"
  # GitHub repo as owner/name. Used for the "Comment on this item" links.
  repo: "brent-segner/Smokey-Road-Issue-Tracking"
  intro: >
    This report documents items identified during our review of the home that
    appear to be incomplete, inconsistent with the contract or agreed
    specifications, improperly installed, or in need of workmanship correction.
    It does not list routine construction tasks that remain before completion
    (for example, installation of toilets or ordinary plumbing connections).
    Contract page references are to the Schumacher Homes Custom Home Quote and
    Construction Agreement dated 4/23/2026.
  request: >
    For each item, please provide a written response identifying (1) whether the
    item is acknowledged, (2) the proposed correction or inspection, (3) the trade
    or person responsible, and (4) the anticipated completion date. Work postponed
    for weather should stay on the list with a specific plan for completion.
    Items requiring technical review should not be closed until the findings and
    any corrective work are documented.
  disclaimer: >
    This report supports a complete and accurate review of the home before final
    acceptance. It does not waive any contractual rights or constitute acceptance
    of incomplete or potentially deficient work.

