  - id: SR-42
    title: "Fireplace TV mount (MantelMount MM815 + RB100): rough-in needed before stone"
    area: "Great Room & Fireplace"
    type: Incomplete
    contract: Schumacher
    trade: Framing / electrical / stone coordination
    status: Open
    description: |
      On September 8 we asked Hollie Curry, Steven Price, Steve Troyer, and Jessica Moore for help making sure we can install a MantelMount MM815 motorized drop-down TV mount with the RB100 recess box after closing. The mount arm folds back into a pocket in the wall so the TV sits nearly flush when raised. This needs three rough-in items, all before the stone goes on:
      1. A framed opening 7.4" W × 28.2" H × 3.7" D, centered on the fireplace above the mantel. Exact height is set from the TV's lower VESA holes, roughly 8" above the mantel; we will confirm it against MantelMount's guide before any cutting.
      2. Solid backing for the mount plate: two full-height studs 16"–24" on center on either side of the opening, plus horizontal blocking across a 36" span. The mount carries up to 115 lb of TV on a cantilevered motorized arm, so it cannot rely on drywall anchors or the stone alone.
      3. A recessed combination box with 120V and low-voltage in separate compartments, about 24" off centerline: clear of the recess box, hidden behind the raised TV, and outside the firebox footprint so the conduit can drop straight down. See also SR-26.
    correction: >
      Complete the framing, blocking, and combination box rough-in before stone is
      applied. If Schumacher cannot do this work, please give us the name and
      contact information of the specific person we need to speak with.
    contract_ref: "p. 3: Stone to one-story ceiling (stone not yet applied)"
    links:
      - { label: "MantelMount MM815 product page", url: "https://www.mantelmount.com/products/mm815-motorized-drop-down-swivel-tv-mount" }
      - { label: "Example installation video", url: "https://www.youtube.com/watch?v=TGc9TN5YzM0" }
    photos: []
    notes: "Time-sensitive: must be done before fireplace stone is installed."
    history:
      - { date: "2026-09-08", note: "Requested from Hollie Curry, Steven Price, Steve Troyer, and Jessica Moore" }
      - { date: "2026-11-19", note: "Added to report" }

